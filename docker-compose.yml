services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clinic_os_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DJANGO_DEBUG=True
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Optional local PostgreSQL service for offline/standalone development
  # (If you are using managed Neon PostgreSQL via DATABASE_URL in .env, you can comment this out)
  db:
    image: postgres:16-alpine
    container_name: clinic_os_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: clinic_os
      POSTGRES_USER: clinic_os
      POSTGRES_PASSWORD: local_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic_os -d clinic_os"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
